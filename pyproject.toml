[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kindle-family-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "APScheduler>=3.10,<4",
  "Pillow>=10,<13",
  "icalendar>=6,<7",
  "recurring-ical-events>=3.8,<4",
  "feedparser>=6,<7",
  "segno>=1.6,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.6,<1", "mypy>=1.11,<3", "jsonschema>=4.23,<5", "types-jsonschema"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.rendering" = ["fonts/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
